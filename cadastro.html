<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Pulsar</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../" data-pagina="cadastro">
  <div id="topo"></div>
  <main class="container" id="conteudo">
    <h1 class="titulo">Cadastre-se</h1>
    <p class="sub">Receba novidades e deixe seu comentário.</p>
    <form id="form-cadastro" novalidate>
      <label for="nome">Nome</label><input id="nome" name="nome" type="text">
      <div class="erro" id="erro-nome"></div>
      <label for="email">E-mail</label><input id="email" name="email" type="email">
      <div class="erro" id="erro-email"></div>
      <label for="mensagem">Mensagem / comentário</label><textarea id="mensagem" name="mensagem" rows="4"></textarea>
      <div class="erro" id="erro-mensagem"></div>
      <button class="enviar" type="submit">Enviar</button>
      <div class="sucesso" id="sucesso"></div>
    </form>
  </main>
  <div id="rodape"></div>
  <script src="../js/dados.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/cadastro.js"></script>
</body>
</html>
